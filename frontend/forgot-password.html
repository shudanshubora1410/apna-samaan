<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery — Apna Samaan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="forgot-password" class="d-flex flex-column min-vh-100">
  <div id="app-navbar"></div>

  <main class="container py-5 flex-grow-1 d-flex align-items-center">
    <div class="mx-auto as-panel p-4 p-lg-5 w-100" style="max-width: 480px;">
      <div class="eyebrow-tag mb-1">ACCOUNT RECOVERY</div>
      <h1 class="h4 fw-bold mb-2">Reset Your Password</h1>
      <p class="small text-secondary mb-4">
        Enter the email address for your Shipper, Driver Partner, or Admin account. If registered, we will email a single-use 15-minute password reset link.
      </p>

      <div id="forgot-success" class="alert alert-success small d-none" role="status"></div>

      <form id="forgot-form" novalidate>
        <div data-form-error class="alert alert-danger py-2 small d-none" role="alert"></div>
        <div class="mb-3">
          <label for="fp-email" class="as-label">Registered Email Address</label>
          <input id="fp-email" name="email" type="email" class="form-control"
                 autocomplete="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" id="btn-forgot" class="btn btn-as-primary w-100 py-2">
          Send 15-Minute Reset Link →
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center small" style="border-color: var(--as-line) !important;">
        <a href="login.html" class="fw-semibold text-dark text-decoration-none">← Return to Sign In</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
