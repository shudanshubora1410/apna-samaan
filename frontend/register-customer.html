<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Shipper Account — Apna Samaan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="register-customer" class="d-flex flex-column min-vh-100">
  <div id="app-navbar"></div>

  <main class="container py-5 flex-grow-1">
    <div class="mx-auto as-panel p-4 p-lg-5" style="max-width: 640px;">
      <div class="eyebrow-tag mb-1">SHIPPER ONBOARDING</div>
      <h1 class="h3 fw-bold mb-1">Open a Shipper Dispatch Account</h1>
      <p class="small text-secondary mb-3">Book commercial vehicles across India with itemised waybills, Razorpay checkout, and live GPS tracking.</p>

      <div class="mb-2">
        <button type="button" data-google-auth-btn class="btn-google-oauth">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span data-google-auth-label>Sign Up with Google</span>
          <span class="google-role-chip">Instant</span>
        </button>
        <div data-google-auth-hint class="text-secondary mt-1 d-none" style="font-size: 0.74rem;"></div>
      </div>

      <div class="auth-divider">Or register with email</div>

      <form id="register-customer-form" novalidate>
        <div data-form-error class="alert alert-danger py-2 small d-none" role="alert"></div>

        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <label for="c-name" class="as-label">Full Name / Contact Person</label>
            <input id="c-name" name="name" type="text" class="form-control" placeholder="Aarav Sharma" required>
          </div>
          <div class="col-12 col-sm-6">
            <label for="c-phone" class="as-label">10-Digit Mobile (Delivery Updates)</label>
            <input id="c-phone" name="phone" type="tel" class="form-control font-mono"
                   placeholder="98XXXXXXXX" maxlength="10" required>
          </div>
          <div class="col-12">
            <label for="c-email" class="as-label">Email Address</label>
            <input id="c-email" name="email" type="email" class="form-control" placeholder="dispatch@company.in" required>
          </div>
          <div class="col-12">
            <label for="c-password" class="as-label">Password (8+ chars)</label>
            <input id="c-password" name="password" type="password" class="form-control"
                   placeholder="Min 8 characters" required>
          </div>
        </div>

        <button type="submit" id="btn-reg-customer" class="btn btn-as-primary w-100 mt-4 py-2">
          Create Shipper Account &amp; Enter Workbench →
        </button>
      </form>

      <div class="mt-4 pt-3 border-top d-flex justify-content-between small" style="border-color: var(--as-line) !important;">
        <span>Already registered? <a href="login.html" class="fw-semibold text-dark">Sign In</a></span>
        <a href="register-driver.html" class="fw-semibold text-decoration-none" style="color: var(--as-vermilion);">Own a vehicle? Apply here →</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
