<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Apna Samaan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="reset-password" class="d-flex flex-column min-vh-100">
  <div id="app-navbar"></div>

  <main class="container py-5 flex-grow-1 d-flex align-items-center">
    <div class="mx-auto as-panel p-4 p-lg-5 w-100" style="max-width: 480px;">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <div class="eyebrow-tag">CREDENTIAL UPDATE</div>
        <span id="rp-link-verified" class="as-badge as-badge-emerald d-none">
          <i class="bi bi-shield-check me-1"></i>Email Link Verified
        </span>
      </div>
      <h1 class="h4 fw-bold mb-2">Choose a New Password</h1>
      <p class="small text-secondary mb-4">
        Enter a strong password of at least 8 characters. Saving a new password automatically signs out active sessions on other devices.
      </p>

      <div id="reset-success" class="alert alert-success small d-none" role="status"></div>

      <form id="reset-form" novalidate>
        <div data-form-error class="alert alert-danger py-2 small d-none" role="alert"></div>

        <div id="rp-token-group" class="mb-3">
          <label for="rp-token" class="as-label">One-Time Reset Token</label>
          <input id="rp-token" name="token" type="text" class="form-control font-mono small"
                 placeholder="Paste token from reset email" required>
        </div>

        <div class="mb-3">
          <label for="rp-password" class="as-label">New Password (8+ characters)</label>
          <div class="input-group">
            <input id="rp-password" name="newPassword" type="password" class="form-control"
                   minlength="8" maxlength="72" autocomplete="new-password"
                   placeholder="Enter new password" required>
            <button type="button" class="btn btn-outline-secondary" data-toggle-pw="rp-password"
                    aria-label="Show or hide new password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label for="rp-confirm-password" class="as-label">Confirm New Password</label>
          <div class="input-group">
            <input id="rp-confirm-password" name="confirmPassword" type="password" class="form-control"
                   minlength="8" maxlength="72" autocomplete="new-password"
                   placeholder="Re-enter new password" required>
            <button type="button" class="btn btn-outline-secondary" data-toggle-pw="rp-confirm-password"
                    aria-label="Show or hide confirm password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-reset" class="btn btn-as-primary w-100 py-2">
          Save New Password →
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center small" style="border-color: var(--as-line) !important;">
        <a href="login.html" class="fw-semibold text-dark text-decoration-none">← Return to Sign In</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
