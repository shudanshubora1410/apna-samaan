name: Apna Samaan CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend ES module syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Start ephemeral MySQL 8 container with runtime-generated credentials
        run: |
          DB_PASS="$(openssl rand -hex 16)"
          JWT_SEC="$(openssl rand -hex 32)"
          ADM_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::${DB_PASS}"
          echo "::add-mask::${JWT_SEC}"
          echo "::add-mask::${ADM_PASS}"
          echo "DB_PASSWORD=${DB_PASS}" >> "$GITHUB_ENV"
          echo "JWT_SECRET=${JWT_SEC}" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=${ADM_PASS}" >> "$GITHUB_ENV"
          docker run -d --name apna-samaan-ci-mysql \
            -e MYSQL_ROOT_PASSWORD="${DB_PASS}" \
            -e MYSQL_DATABASE=apna_samaan_test \
            -e MYSQL_USER=apna_ci_user \
            -e MYSQL_PASSWORD="${DB_PASS}" \
            -p 3306:3306 \
            mysql:8.0 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 30); do
            if docker exec apna-samaan-ci-mysql mysqladmin ping -h 127.0.0.1 -uapna_ci_user -p"${DB_PASS}" --silent 2>/dev/null; then
              echo "MySQL 8 is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 8 failed to become ready" && exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, run tests, and generate JaCoCo coverage report
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/apna_samaan_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: apna_ci_user
          CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5500
        run: mvn -B clean verify

      - name: Verify production multi-stage Docker image builds cleanly
        run: docker build -t apna-samaan:ci .

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
